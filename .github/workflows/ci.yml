name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  version:
    name: Check package version change
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" || "${{ github.ref_name }}" != "main" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --unified=0 "$before" "${{ github.sha }}" -- Cargo.toml | grep -E '^[+-]version[[:space:]]*='; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows build and test
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.should_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Read package version
        id: package_version
        if: github.event_name == 'push' && github.ref_name == 'main'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare release asset
        if: github.event_name == 'push' && github.ref_name == 'main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Path target\release\singboost.exe -Destination dist\singboost-windows-x86_64.exe -Force

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package_version.outputs.version }}
          name: v${{ steps.package_version.outputs.version }}
          files: dist/singboost-windows-x86_64.exe
