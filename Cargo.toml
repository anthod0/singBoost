[package]
name = "singboost"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
open = "5.3.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = "0.3.47"
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(not(windows))'.dependencies]
ureq = "3.3.0"

[target."cfg(windows)".dependencies]
tao = "0.35.3"
tray-icon = "0.24.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
